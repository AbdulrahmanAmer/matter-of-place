<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Matter of Place, reel</title>
<link rel="stylesheet" href="/app/src/styles/tokens.css">
<style>
  @font-face { font-family: "Jost"; src: url("/app/public/fonts/jost-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
  @font-face { font-family: "Cormorant Garamond"; src: url("/app/public/fonts/cormorant-garamond-latin-wght-normal.woff2") format("woff2"); font-weight: 300 700; font-display: block; }
  /* palette by token: --foreground Obsidian, --secondary Bone, --accent Sandstone */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--foreground); }
  body { position: relative; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; font-kerning: normal; }

  .shot { position: absolute; inset: 0; overflow: hidden; visibility: hidden; }
  .rig { position: absolute; inset: 0; overflow: hidden; }
  .plane { position: absolute; inset: -10%; background-size: cover; background-position: center; will-change: transform, filter; }
  .half { position: absolute; inset: 0; will-change: transform; }
  .half.top { clip-path: inset(0 0 50% 0); }
  .half.bottom { clip-path: inset(50% 0 0 0); }
  .obsidian { background: var(--foreground); }

  .scrim { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  .scrim > div { position: absolute; inset: 0; background: var(--foreground); }
  .type { position: absolute; z-index: 2; color: var(--secondary); }

  .caps { font-family: var(--font-sans); font-weight: 400; text-transform: uppercase; white-space: nowrap; }
  .serif { font-family: var(--font-serif); font-weight: 400; }
  .m1 .ln { display: block; overflow: hidden; padding: 0.04em 0.06em 0.16em; margin-bottom: -0.16em; }
  .m1 .ln > span { display: inline-block; white-space: nowrap; will-change: transform; }
  .w { position: relative; display: inline-block; }
  .w .w5 { position: absolute; left: 0; top: 0; font-weight: 500; opacity: 0; }

  .rule { position: absolute; z-index: 2; height: 1px; background: var(--accent); transform-origin: 0 50%; }

  #label { left: 80px; top: 1370px; font-size: 30px; letter-spacing: 0.14em; }
  #title { left: 80px; bottom: 440px; line-height: 1.04; }
  #facts { left: 80px; top: 1320px; font-size: 34px; letter-spacing: 0.14em; }
  #rule { left: 80px; top: 1386px; width: 920px; }

  #grid { position: absolute; inset: 0; transform-origin: 50% 50%; }
  .tile { position: absolute; left: 0; top: 0; width: 468px; height: 540px; background-size: cover; background-position: center; will-change: transform; }

  .endcard { position: absolute; z-index: 2; left: 0; right: 0; top: 0; height: 1920px; color: var(--secondary); text-align: center; }
  .endcard > * { position: absolute; left: 0; right: 0; }
  #price { top: 985px; font-family: var(--font-sans); font-weight: 300; font-size: 76px; letter-spacing: 0.02em; }
    #emblem { left: 480px; width: 120px; height: 134px; top: 1130px; overflow: visible; color: var(--secondary); }
  #word { top: 1312px; }
  #word .ln { padding: 0; margin: 0; }
  #word img { display: block; width: 640px; height: auto; margin: 0 auto; }
  #site { top: 1398px; font-family: var(--font-sans); font-weight: 400; font-size: 28px; letter-spacing: 0.08em; color: var(--accent); }
  #credit { top: 1470px; font-size: 20px; color: var(--accent); }
</style>
</head>
<body>

<section class="shot" id="s8">
  <div class="rig" id="s8-rig"></div>
  <div class="endcard">
    <div class="m1" id="price"><span class="ln"><span></span></span></div>
    <svg id="emblem" viewBox="0 0 68 76" fill="none" aria-hidden="true">
      <path id="emblem-back" d="M8 5h52v65l-12-6V21L34 16 30 16.4 9 6.2 8 5Z" fill="currentColor" opacity=".4"/>
      <path id="emblem-front" d="M8 5 34 16 20 21v43L8 70V5Z" fill="currentColor" opacity=".9"/>
    </svg>
    <div class="m1" id="word"><span class="ln"><span><img src="/brand/logo/wordmark/wordmark-horizontal-bone.svg" alt="Matter of Place"></span></span></div>
    <div class="m1" id="site"><span class="ln"><span></span></span></div>
    <div class="caps" id="credit"></div>
  </div>
</section>

<section class="shot" id="s7b">
  <div class="half top" id="s7b-t"><div class="rig"></div></div>
  <div class="half bottom" id="s7b-b"><div class="rig"></div></div>
</section>

<section class="shot obsidian" id="s7"><div id="grid"></div></section>

<section class="shot" id="s3">
  <div class="rig" id="s3-rig"></div>
  <div class="rule" id="rule"></div>
  <div class="type m1 caps" id="facts"><span class="ln"><span></span></span></div>
</section>

<section class="shot" id="s2">
  <div class="half top" id="s2-t"><div class="rig"></div></div>
  <div class="half bottom" id="s2-b"><div class="rig"></div><div class="type m1 serif" id="title"></div></div>
</section>

<section class="shot" id="s1">
  <div class="half top" id="s1-t"><div class="rig"></div></div>
  <div class="half bottom" id="s1-b"><div class="rig"></div><div class="type caps" id="label"></div></div>
</section>

<section class="shot obsidian" id="cut"></section>

<script type="module" src="./scene.mjs"></script>
</body>
</html>
