<title>Film Title</title>
<style>
/* Player page: the stage, a control bar, the shot list. Colours come from the brand; both themes are defined. */
:root { --bg: #EEEAE1; --fg: #11110F; --muted: #625F58; --line: rgba(17,17,15,.17); --stage: #11110F; --serif: "Film Serif", Georgia, serif; --sans: "Film Sans", "Helvetica Neue", Arial, sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #11110F; --fg: #EEEAE1; --muted: #9E9A91; --line: rgba(238,234,225,.17); } }
:root[data-theme="dark"] { --bg: #11110F; --fg: #EEEAE1; --muted: #9E9A91; --line: rgba(238,234,225,.17); }
/*__FONTS__*/
*, *::before, *::after { box-sizing: border-box; } [hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--sans); }
.wrap { max-width: 1280px; margin-inline: auto; padding: clamp(16px, 4vw, 40px) clamp(16px, 4vw, 44px) 56px; display: grid; gap: 20px; }
h1 { margin: 0; font: 300 clamp(26px, 3.2vw, 36px)/1.1 var(--serif); }
.player { border: 1px solid var(--line); min-width: 0; }
.frame { position: relative; aspect-ratio: 16 / 9; background: var(--stage); overflow: hidden; }
.frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#hud { pointer-events: none; }
.vig, .grain { position: absolute; inset: 0; pointer-events: none; }      /* the finish, carried by the compositor instead of the per-frame draw */
.vig { background: radial-gradient(circle farthest-corner at 50% 50%, rgba(0,0,0,0) 43.6%, rgba(0,0,0,0.86) 100%); opacity: 0.2; }
.grain { inset: -260px; background-repeat: repeat; mix-blend-mode: overlay; opacity: 0.1; will-change: transform; }
.fallback { position: absolute; inset: 0; margin: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: #EEEAE1; font: 300 20px/1.5 var(--serif); }
.player:fullscreen { display: grid; grid-template-rows: minmax(0, 1fr) auto; background: #000; border: 0; }
.player:fullscreen .frame { width: min(100%, calc((100vh - 60px) * 16 / 9)); margin: auto; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 10px 12px; border-top: 1px solid var(--line); background: var(--bg); }
.btn { height: 36px; padding: 0 14px; border: 1px solid var(--line); background: transparent; color: var(--fg); font: 500 11.5px/1 var(--sans); letter-spacing: .18em; text-transform: uppercase; cursor: pointer; }
.btn[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
#seek { flex: 1 1 200px; min-width: 0; accent-color: var(--fg); }
#time { font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--muted); }
.shots { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px 14px; }
.shots button { display: grid; gap: 4px; width: 100%; padding: 12px 0 0; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--fg); font: inherit; text-align: left; cursor: pointer; }
.shots button[aria-current="true"] { border-top-color: var(--fg); }
.shots .tc { font-size: 11.5px; letter-spacing: .16em; color: var(--muted); } .shots .nm { font: 300 21px/1.15 var(--serif); } .shots .ln { font-size: 13px; color: var(--muted); }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
</style>
<main class="wrap">
  <h1>Film Title</h1>
  <section class="player" id="player" aria-label="Film">
    <div class="frame" id="frame">
      <canvas id="gl" width="1920" height="1080" role="img" aria-label="Describe the whole film here in a few sentences."></canvas>
      <canvas id="hud" width="1920" height="1080" aria-hidden="true"></canvas>
      <div class="vig" id="vig"></div><div class="grain" id="grain"></div>
      <p class="fallback" id="fallback" hidden>This film is drawn live in 3D, and that could not start here: either WebGL is turned off or the page could not load its 3D library. The MP4 plays everywhere.</p>
    </div>
    <div class="bar">
      <button class="btn" id="play" type="button">Pause</button>
      <input id="seek" type="range" min="0" max="1" step="0.01" value="0" aria-label="Position in film, seconds">
      <output id="time" for="seek"></output>
      <button class="btn" id="sound" type="button" aria-pressed="false">Sound off</button>
      <button class="btn" id="full" type="button">Full screen</button>
    </div>
  </section>
  <ol class="shots" id="shots" aria-label="Shots in the film"></ol>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
