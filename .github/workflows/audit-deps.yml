name: audit-deps

# H1 step 4: the dependency audit of app/ and launch/, gitleaks over the git history and the checkout (H1-08, H1-10),
# and the runbook lint. ci.yml ignores **/*.md (B1b), so a pull request that edits only a runbook or docs/security.md
# is linted here (G-012: paths-ignore cannot carry an exception).
# Cost (C22): measured on runs 37876481838 and 37876648822, audit 22 s and runbook-lint 8 to 9 s, each billed as one
# whole minute, so 2 Actions minutes a run: about 9 a month from the weekly schedule, plus 2 for each push to a pull
# request that touches the paths below; drawn from the 2,000 minutes a month of GOTCHAS P-009.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    paths: ["app/docs/runbooks/**", "app/docs/security.md", "app/scripts/harden/**"]

permissions: {}

defaults:
  run:
    working-directory: app

concurrency:
  group: audit-deps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file (2026-10-09).
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      # fetch-depth 0: gitleaks reads the whole history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: gitleaks
        working-directory: .
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --redact --config app/scripts/harden/gitleaks.toml
          "$RUNNER_TEMP/gitleaks" detect --source . --no-git --redact --config app/scripts/harden/gitleaks.toml
      - name: audit app
        run: bun install --frozen-lockfile && bun run audit:deps
      - name: audit launch
        working-directory: launch
        run: bun install --frozen-lockfile && bun run audit:deps

  runbook-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: security
        run: node scripts/harden/runbook-lint.mjs docs/security.md
      - name: runbooks
        if: ${{ !cancelled() }}
        run: node scripts/harden/runbook-lint.mjs docs/runbooks
