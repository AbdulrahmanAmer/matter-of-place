name: deploy

# Pull request previews (B1b step 6). Every pull request job refuses forks and Dependabot
# (invariants 6 and 8), and none links, migrates or reads the dev database (invariant 13).
# Cost (C22), measured on 2026-10-02 (PRs 43, 44, 50, 51): preview-db 11 to 19 s, preview 38 to
# 60 s, preview-cleanup 19 s, each billed as one whole minute. A push to a draft costs 1 Actions
# minute here, a push to a ready pull request 2, closing it 1, on top of ci.yml; drawn from the
# 2,000 minutes a month of GOTCHAS P-009, and one pr-<n> Worker per open ready pull request from
# the Workers free plan.
# Deploys from main (B1b step 7): once ci passes on a push to main, dev and then production deploy
# that commit (invariant 6a); production only while PRODUCTION_DEPLOY is on (H49 (1)). Cost (C22),
# estimated from the preview job until the first merge is measured (UNPROVEN): about 1 minute
# each, so 1 Actions minute per code push to main while production is off and 2 after, from the
# same P-009 line; two Workers of the free plan.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, closed]
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      rehearse_rollback:
        description: Force the dev smoke red so its rollback step runs (DO-09)
        type: boolean
        default: false

permissions: {}

defaults:
  run:
    working-directory: app

jobs:
  # A preview runs against main's schema until its migration merges (DB-01): this job only says so.
  preview-db:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-db-${{ github.event.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Three dots: what the pull request changed since it left main, not what main gained since.
      - name: migrations
        id: migrations
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE...$HEAD" -- 'supabase/migrations/*.sql' | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: comment
        if: steps.migrations.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
        run: |
          posted=$(gh pr view "$PR" --json comments --jq '[.comments[].body | select(startswith("preview-db:"))] | length')
          if [ "$posted" = "0" ]; then
            gh pr comment "$PR" --body "preview-db: this preview runs against main's schema until the migration merges; the PR's database proof is the ci db job"
          fi

  # Heavy (invariant 14): drafts and CI_HEAVY=off skip it. B4 appends the change test, the
  # @overflow run and the Lighthouse gate after the smoke; B8b points --config at the copy without
  # a cron trigger.
  preview:
    needs: preview-db
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && github.event.pull_request.draft == false && vars.CI_HEAVY != 'off'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.number }}
      cancel-in-progress: true
    # False once L1's launch switch removes the database pair from the bundle (invariant 13a).
    env:
      HAS_DB: ${{ fromJSON(secrets.PREVIEW_WORKER_SECRETS_JSON).SUPABASE_URL != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock') }}
      - run: bun install --frozen-lockfile
      # Cloudflare's public always-pass Turnstile test key; never the real one on a preview.
      - name: build
        env:
          VITE_SITE_URL: https://pr-${{ github.event.number }}.holy-meadow-4327.workers.dev
          VITE_API_BASE_URL: ${{ env.HAS_DB == 'true' && vars.VITE_API_BASE_URL || '' }}
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
        run: bun run build
      # A preview carries no cron trigger: each open pull request would add one more cron trigger.
      - run: node scripts/preview-no-cron.mjs .output/server/wrangler.json .output/server/wrangler.preview.json
      # On a pull request github.sha is the merge commit, which is what was built (invariant 11).
      - name: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy --config .output/server/wrangler.preview.json --name pr-${{ github.event.number }} --var MOP_ENV:${{ env.HAS_DB == 'true' && 'preview' || 'local' }} --var SENTRY_RELEASE:${{ github.sha }} --var MEDIA_PUBLIC_BASE:https://pr-${{ github.event.number }}.holy-meadow-4327.workers.dev/media
      # The one definition of PREVIEW_URL; B4's and B17's appended steps read it.
      - run: echo "PREVIEW_URL=https://pr-${{ github.event.number }}.holy-meadow-4327.workers.dev" >> "$GITHUB_ENV"
      # The whole bundle, so a later slice adds a preview secret by adding a key to it (F12). The
      # Worker must exist first; a request in between answers the calm 500.
      - name: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_WORKER_SECRETS_JSON: ${{ secrets.PREVIEW_WORKER_SECRETS_JSON }}
        run: printf '%s' "$PREVIEW_WORKER_SECRETS_JSON" | bunx wrangler secret bulk --name pr-${{ github.event.number }}
      # A Worker name deployed for the first time answers Cloudflare's own 404 now and then for
      # about 20 s, between answers of ours (GOTCHAS P-137); every answer of ours carries
      # x-request-id, so the smoke waits for ten of them in a row.
      - name: wait
        run: |
          ok=0
          for i in $(seq 1 90); do
            if curl -s -o /dev/null -D - "$PREVIEW_URL/" | grep -qi '^x-request-id:'; then
              ok=$((ok + 1))
            else
              ok=0
            fi
            if [ "$ok" -ge 10 ]; then
              echo "the Worker answered ten times in a row after $i requests"
              exit 0
            fi
            sleep 2
          done
          echo "the Worker did not answer ten times in a row in 180 s"
          exit 1
      - name: smoke
        run: node scripts/smoke.mjs "$PREVIEW_URL"
      # B17 step 12: the essentials spec on the deployed build. B4's install below runs only for a front-end change,
      # so this step installs the browser itself. E2E_MODE=live runs the cases that skip on a local build; only a
      # preview built with a database is live (HAS_DB), the one built after the launch switch is local.
      # CI stays set, so playwright.config.ts keeps its one retry, forbidOnly and failOnFlakyTests: a case that passes
      # only on the retry is reported as a failure, so a retry cannot hide a defect. Ruling H67 (2026-10-07): until
      # the cause of the preview stall is found (GOTCHAS P-1936: page.goto timeouts from the runner that do not
      # reproduce from a laptop, misses answering in about a second), a red essentials step does not fail the job;
      # it is printed as a warning and in the job summary by the step below. ci.yml's e2e job stays the hard gate on
      # the spec itself.
      # Cost (C22, P-009): about 2 minutes of runner time a preview run (run 37550497051 of the first version of this
      # step: e2e 2.1 min, install not timed), free on a public repository; the Worker requests and Storage egress of the
      # pages it loads are not counted (UNPROVEN).
      - run: bun run test:e2e:install
      - name: essentials
        id: essentials
        continue-on-error: true
        env:
          E2E_TARGET: url
          E2E_BASE_URL: ${{ env.PREVIEW_URL }}
          E2E_MODE: ${{ env.HAS_DB == 'true' && 'live' || 'local' }}
        run: bun run test:e2e -- tests/e2e/essentials.spec.ts
      - name: essentials verdict
        if: ${{ steps.essentials.outcome == 'failure' }}
        run: |
          echo "::warning title=essentials red on the preview::advisory under ruling H67 until GOTCHAS P-1936 is closed; read the essentials step"
          echo "essentials: red on the preview (advisory, H67, P-1936)" >> "$GITHUB_STEP_SUMMARY"
      # Prints the grade; it fails the job below A only once the policy is enforcing (flags.csp_enforce). It runs
      # after a red essentials step too, so the log of a failed run still shows the grade.
      - name: observatory
        if: ${{ !cancelled() }}
        run: node scripts/observatory.mjs pr-${{ github.event.number }}.holy-meadow-4327.workers.dev
      # B4 step 10: a front-end change is measured on the preview. The files come from the API: the checkout holds no
      # credentials (persist-credentials: false), so a fetch of the two commits would be refused on a private repository.
      - name: change test
        id: fe
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
        run: |
          files=$(gh api "repos/${{ github.repository }}/pulls/$PR/files" --paginate --jq '.[].filename')
          if printf '%s\n' "$files" | grep -qE '^app/(src/|public/|package\.json$|budget\.json$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      # Real fonts here, so the overflow check of invariant 5 runs on the deployed build.
      # Advisory under ruling H67 like the essentials step: the same runner-side stall (P-1936) failed three
      # overflow cases on PR 211 while the whole sweep passed from a laptop against the same preview.
      - name: overflow
        id: overflow
        continue-on-error: true
        if: steps.fe.outputs.changed == 'true' && github.event.pull_request.draft == false && vars.CI_HEAVY != 'off'
        env:
          E2E_TARGET: url
          E2E_BASE_URL: ${{ env.PREVIEW_URL }}
          E2E_MODE: live
        run: |
          bun run test:e2e:install
          bunx playwright test --project=phone --grep @overflow
      - name: overflow verdict
        if: ${{ steps.overflow.outcome == 'failure' }}
        run: |
          echo "::warning title=overflow red on the preview::advisory under ruling H67 until GOTCHAS P-1936 is closed; read the overflow step"
          echo "overflow: red on the preview (advisory, H67, P-1936)" >> "$GITHUB_STEP_SUMMARY"
      - name: lighthouse
        if: steps.fe.outputs.changed == 'true' && github.event.pull_request.draft == false && vars.CI_HEAVY != 'off'
        run: |
          urls=$(node scripts/lhci-urls.mjs "$PREVIEW_URL")
          bun run lhci -- $(printf '%s\n' "$urls" | sed 's/^/--collect.url=/')
          node scripts/perf-targets.mjs .lighthouseci
      - name: comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
        run: |
          posted=$(gh pr view "$PR" --json comments --jq '[.comments[].body | select(startswith("preview: "))] | length')
          if [ "$posted" = "0" ]; then
            gh pr comment "$PR" --body "preview: $PREVIEW_URL"
          fi

  # Keeps the account under its free Worker count (invariant 5). It shares the preview's group and
  # waits, so a preview still deploying cannot bring the Worker back after the delete.
  preview-cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    concurrency:
      group: preview-${{ github.event.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock') }}
      - run: bun install --frozen-lockfile
      # A pull request closed before any preview has no Worker: Cloudflare answers code 10090.
      - name: delete
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER: pr-${{ github.event.number }}
        run: |
          if out=$(bunx wrangler delete --name "$WORKER" --force 2>&1); then
            printf '%s\n' "$out"
          elif printf '%s' "$out" | grep -q "code: 10090"; then
            printf '%s\nno preview Worker %s\n' "$out" "$WORKER"
          else
            printf '%s\n' "$out"
            exit 1
          fi

  # The stable dev Worker (G19) and the one database step of this workflow (invariant 13): it
  # pushes main's migrations to the one project before its Worker deploy, before and after the
  # launch switch (H35 (5)). workflow_dispatch from main runs it alone for the rollback rehearsal.
  dev:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: dev-worker
      cancel-in-progress: false
    # HAS_DB is false once L1's launch switch removes the database pair from the bundle (13a).
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      URL: https://matter-of-place-dev.holy-meadow-4327.workers.dev
      HAS_DB: ${{ fromJSON(secrets.PREVIEW_WORKER_SECRETS_JSON).SUPABASE_URL != '' }}
    steps:
      # The commit ci passed; on workflow_run, github.sha is the newest main, not necessarily it.
      # fetch-depth 0 brings origin/main for the guard.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # A re-run of an older green ci run must not deploy old code over new (DO-04).
      - name: guard
        id: guard
        run: node scripts/deploy-guard.mjs "$SHA"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.guard.outputs.superseded != 'true'
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.guard.outputs.superseded != 'true'
        with:
          node-version: 24
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.guard.outputs.superseded != 'true'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock') }}
      - if: steps.guard.outputs.superseded != 'true'
        run: bun install --frozen-lockfile
      # Before B2's first migration there is no db:push script and nothing to push.
      - name: migrations
        id: migrations
        if: steps.guard.outputs.superseded != 'true'
        run: |
          if git ls-files 'supabase/migrations/*.sql' | grep -q .; then
            echo "has_migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_migrations=false" >> "$GITHUB_OUTPUT"
          fi
      # A failed push ends the job red before the Worker deploy.
      - name: db-push
        if: steps.guard.outputs.superseded != 'true' && steps.migrations.outputs.has_migrations == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DEV_SUPABASE_PROJECT_REF: ${{ secrets.DEV_SUPABASE_PROJECT_REF }}
          DEV_SUPABASE_DB_PASSWORD: ${{ secrets.DEV_SUPABASE_DB_PASSWORD }}
        run: |
          bunx supabase link --project-ref "$DEV_SUPABASE_PROJECT_REF" --password "$DEV_SUPABASE_DB_PASSWORD"
          bun run db:push
      # The one job runner follows main only, here and in no other job (H35 (1), (8)). Its function
      # secrets are set once by hand and a deploy keeps them.
      - name: functions-deploy
        if: steps.guard.outputs.superseded != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DEV_SUPABASE_PROJECT_REF: ${{ secrets.DEV_SUPABASE_PROJECT_REF }}
        run: bunx supabase functions deploy job-runner --use-api --project-ref "$DEV_SUPABASE_PROJECT_REF"
      # The version serving now is the rollback target. The secrets step below makes a deployment
      # of the new code, so a rollback without an id can reinstall it (H49 (2)). Cloudflare answers
      # code 10007 for a Worker that does not exist yet: then there is no target.
      - name: current
        id: current
        if: steps.guard.outputs.superseded != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if out=$(bunx wrangler deployments list --name matter-of-place-dev --json 2>"$RUNNER_TEMP/current.err"); then
            version=$(printf '%s' "$out" | jq -r 'last | .versions[] | select(.percentage == 100) | .version_id')
          elif grep -q "code: 10007" "$RUNNER_TEMP/current.err"; then
            version=""
          else
            cat "$RUNNER_TEMP/current.err"
            exit 1
          fi
          echo "serving: ${version:-none}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: build
        if: steps.guard.outputs.superseded != 'true'
        env:
          VITE_SITE_URL: https://matter-of-place-dev.holy-meadow-4327.workers.dev
          VITE_API_BASE_URL: ${{ env.HAS_DB == 'true' && vars.VITE_API_BASE_URL || '' }}
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
        run: bun run build
      # The unmodified config, so the Worker keeps its keep-warm cron once B8b adds it.
      - name: deploy
        id: deploy
        if: steps.guard.outputs.superseded != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy --config .output/server/wrangler.json --name matter-of-place-dev --var MOP_ENV:${{ env.HAS_DB == 'true' && 'preview' || 'local' }} --var SENTRY_RELEASE:$SHA --var MEDIA_PUBLIC_BASE:https://matter-of-place-dev.holy-meadow-4327.workers.dev/media
      - name: secrets
        if: steps.guard.outputs.superseded != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_WORKER_SECRETS_JSON: ${{ secrets.PREVIEW_WORKER_SECRETS_JSON }}
        run: printf '%s' "$PREVIEW_WORKER_SECRETS_JSON" | bunx wrangler secret bulk --name matter-of-place-dev
      # A first deploy of a Worker name answers Cloudflare's own 404 now and then (GOTCHAS P-137).
      - name: wait
        if: steps.guard.outputs.superseded != 'true'
        run: |
          ok=0
          for i in $(seq 1 90); do
            if curl -s -o /dev/null -D - "$URL/" | grep -qi '^x-request-id:'; then
              ok=$((ok + 1))
            else
              ok=0
            fi
            if [ "$ok" -ge 10 ]; then
              echo "the Worker answered ten times in a row after $i requests"
              exit 0
            fi
            sleep 2
          done
          echo "the Worker did not answer ten times in a row in 180 s"
          exit 1
      # rehearse_rollback forces this smoke red so the rollback below runs for real (DO-09).
      - name: smoke
        if: steps.guard.outputs.superseded != 'true'
        env:
          SMOKE_FORCE_FAIL: ${{ inputs.rehearse_rollback && '1' || '' }}
        run: node scripts/smoke.mjs "$URL"
      # GitHub's failed-run email is the alert; no retry, the fix is a new commit.
      - name: rollback
        if: failure() && steps.deploy.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS: ${{ steps.current.outputs.version }}
        run: |
          if [ -z "$PREVIOUS" ]; then
            echo "first deploy: nothing to roll back to"
            exit 1
          fi
          bunx wrangler rollback "$PREVIOUS" --name matter-of-place-dev --message "smoke failed $SHA" --yes
          echo "rolled back to $PREVIOUS"

  # Deploys only the commit ci passed on a push to main (invariant 6a), after dev has migrated the
  # one database (needs: dev, H35). It links no project, pushes no migration and deploys no Edge
  # Function (invariant 13). Production never shows an illustrative property: the job stays off
  # until the orchestrator sets PRODUCTION_DEPLOY to on, once coming-soon mode (B3b) is on main
  # (H49 (1)).
  production:
    needs: dev
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && vars.PRODUCTION_DEPLOY == 'on'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      URL: https://matter-of-place.holy-meadow-4327.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: guard
        id: guard
        run: node scripts/deploy-guard.mjs "$SHA"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.guard.outputs.superseded != 'true'
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.guard.outputs.superseded != 'true'
        with:
          node-version: 24
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.guard.outputs.superseded != 'true'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock') }}
      - if: steps.guard.outputs.superseded != 'true'
        run: bun install --frozen-lockfile
      - name: build
        if: steps.guard.outputs.superseded != 'true'
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_GA4_MEASUREMENT_ID: ${{ vars.VITE_GA4_MEASUREMENT_ID }}
        run: bun run build
      # MOP_ENV keeps the wrangler.toml default, production. Media is served from the Worker's own
      # origin until L1 sets MOP_LAUNCHED at the domain cut-over (H33 (4)).
      - name: deploy
        id: deploy
        if: steps.guard.outputs.superseded != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy --config .output/server/wrangler.json --var SENTRY_RELEASE:$SHA --var MEDIA_PUBLIC_BASE:${{ vars.MOP_LAUNCHED == 'true' && 'https://matterofplace.com/media' || 'https://matter-of-place.holy-meadow-4327.workers.dev/media' }}
      - name: wait
        if: steps.guard.outputs.superseded != 'true'
        run: |
          ok=0
          for i in $(seq 1 90); do
            if curl -s -o /dev/null -D - "$URL/" | grep -qi '^x-request-id:'; then
              ok=$((ok + 1))
            else
              ok=0
            fi
            if [ "$ok" -ge 10 ]; then
              echo "the Worker answered ten times in a row after $i requests"
              exit 0
            fi
            sleep 2
          done
          echo "the Worker did not answer ten times in a row in 180 s"
          exit 1
      # The workers.dev address answers noindex before and after the domain cut-over.
      - name: smoke
        if: steps.guard.outputs.superseded != 'true'
        run: node scripts/smoke.mjs "$URL"
      # Coming-soon mode holds (B3b step 10), only once L1's launch switch has made the one database production
      # (H35 (4)); after the domain cut-over MOP_LAUNCHED keeps only the illustrative check. A failure is
      # rolled back below, never retried.
      - name: assert-coming-soon
        if: steps.guard.outputs.superseded != 'true' && vars.MOP_DB_PRODUCTION == 'true'
        run: node scripts/assert-coming-soon.mjs "$URL" ${{ vars.MOP_LAUNCHED == 'true' && '--after-launch' || '' }}
      - name: rollback
        if: failure() && steps.deploy.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler rollback --name matter-of-place --message "smoke failed $SHA" --yes
