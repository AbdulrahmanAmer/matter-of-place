name = "matter-of-place"
compatibility_date = "2026-09-30"
compatibility_flags = ["nodejs_compat"]

# Stage 5 custom domain: uncomment when matterofplace.com moves to this zone.
# routes = [
#   { pattern = "matterofplace.com", custom_domain = true },
#   { pattern = "www.matterofplace.com", custom_domain = true },
# ]

[triggers]
crons = ["*/10 * * * *"]

[vars]
MOP_ENV = "production"
MEDIA_PUBLIC_BASE = "https://matterofplace.com/media"

# Gap audit item 20: Workers Logs with per-request CPU and wall time, every request kept (head_sampling_rate 1). The free
# plan keeps 200,000 events a day; the site serves far fewer. Lower the rate before raising any limit.
[observability]
enabled = true
head_sampling_rate = 1
