<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Offline | Matter of Place</title>
    <style>
      @font-face {
        font-family: "Cormorant Garamond";
        src: url("/fonts/cormorant-garamond-latin-wght-normal.woff2") format("woff2");
        font-weight: 300 700;
        font-display: swap;
      }
      @font-face {
        font-family: "Jost";
        src: url("/fonts/jost-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: #f5f2eb;
        color: #11110f;
        font-family: "Jost", system-ui, sans-serif;
      }
      main {
        max-width: 32rem;
        padding: 2rem;
        text-align: center;
      }
      .eyebrow {
        font-size: 0.6875rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      h1 {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-weight: 400;
        font-size: clamp(2.5rem, 7vw, 4.5rem);
        line-height: 1;
        margin: 1rem 0 1.25rem;
      }
      p {
        line-height: 1.7;
        color: #575751;
      }
      a {
        color: #11110f;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Matter of Place</p>
      <h1>You are offline</h1>
      <p>This page needs a connection. When you are back online, <a href="/">return home</a>.</p>
    </main>
  </body>
</html>
