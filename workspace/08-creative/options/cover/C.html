<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Option</title>
<link rel="stylesheet" href="../../../../brand/colors/palette.css">
<style>
@font-face{font-family:"Jost";src:url("../../../../brand/typography/jost/jost-variable.woff2") format("woff2");font-weight:100 900}
@font-face{font-family:"Urbanist";src:url("../../../../brand/typography/urbanist/urbanist-variable.woff2") format("woff2");font-weight:100 900}
@font-face{font-family:"Cormorant Garamond";src:url("../../../../brand/typography/cormorant-garamond/cormorant-garamond-variable.woff2") format("woff2");font-weight:100 900}
:root{--font-sans:"Jost",sans-serif;--font-serif:"Cormorant Garamond",Georgia,serif;--font-ui:"Urbanist",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}

.num{font-family:var(--font-serif);font-weight:500}
